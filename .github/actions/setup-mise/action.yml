name: Setup mise
description: Install mise and the tools mise.toml defines

# Three jobs need mise. `setup` needs it with Go, pnpm and several caches.
# `license-check` and `workflow-lint` need only mise and take about twenty
# seconds. To route them through `setup` would make two fast jobs slow.
#
# Both shapes enter through this action, so the mise version has one home.
# Keep it that way. A new job that needs mise must use this action, or
# `setup`, and must not call `jdx/mise-action` directly.
runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@v4
      with:
        experimental: true
