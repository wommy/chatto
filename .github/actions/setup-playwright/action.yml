name: Setup Playwright
description: Cache and install the Chromium browser and system dependencies used by Playwright
inputs:
  working-directory:
    description: Directory whose Playwright dependency selects the browser build
    required: false
    default: apps/frontend
  save-cache:
    description: Save the shared browser cache when the job completes
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: playwright-version
      shell: bash
      run: |
        version="$(pnpm --dir "${{ inputs.working-directory }}" exec playwright --version)"
        echo "version=${version// /-}" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright browsers
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          playwright-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore and save Playwright browsers
      if: inputs.save-cache == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          playwright-${{ runner.os }}-${{ runner.arch }}-

    - name: Install Playwright browser
      # No --with-deps: it re-runs `apt-get update && apt-get install` on
      # every job, and every package it wants is already on the ubuntu-latest
      # hosted runner image (measured: ~13s per job, entirely "already the
      # newest version" with nothing actually installed). If GitHub ever
      # drops one of Chromium's shared-library deps from that image, this
      # fails loudly at browser launch, not silently -- re-add --with-deps
      # then, or if this ever runs on a non-ubuntu-latest runner.
      shell: bash
      run: pnpm --dir "${{ inputs.working-directory }}" exec playwright install chromium
