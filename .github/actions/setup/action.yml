name: "Setup Environment"
description: "Sets up mise with caching, then installs Go, Node.js, pnpm, and dependencies"
inputs:
  install-ffmpeg:
    description: "Install ffmpeg (only needed for E2E tests with video processing)"
    required: false
    default: "false"
  install-cli-deps:
    description: "Install Go/CLI dependencies"
    required: false
    default: "true"
  install-frontend-deps:
    description: "Install frontend dependencies"
    required: false
    default: "true"
  save-go-build-cache:
    description: "Save the shared Go build cache when the job completes"
    required: false
    default: "false"
  save-task-cache:
    description: "Save the shared mise task-artifact cache when the job completes"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Cache Go modules
      if: inputs.install-cli-deps == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli/go.sum', 'authling/go.sum', 'pkg/appconfig/go.sum', 'pkg/datacrypto/go.sum', 'pkg/events/go.sum', 'pkg/natsruntime/go.sum', 'go.work.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore Go build artifacts
      if: inputs.install-cli-deps == 'true' && inputs.save-go-build-cache != 'true'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/go-build
        key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'authling/mise.toml', 'cli/go.sum', 'authling/go.sum', 'pkg/appconfig/go.sum', 'pkg/datacrypto/go.sum', 'pkg/events/go.sum', 'pkg/natsruntime/go.sum', 'go.work.sum') }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'authling/mise.toml', 'cli/go.sum', 'authling/go.sum', 'pkg/appconfig/go.sum', 'pkg/datacrypto/go.sum', 'pkg/events/go.sum', 'pkg/natsruntime/go.sum', 'go.work.sum') }}-
          go-build-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore and save Go build artifacts
      if: inputs.install-cli-deps == 'true' && inputs.save-go-build-cache == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/go-build
        # Go's build cache is content-addressed. Restore the newest compatible
        # cache, then save this commit's compiled source state for the next run.
        key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'authling/mise.toml', 'cli/go.sum', 'authling/go.sum', 'pkg/appconfig/go.sum', 'pkg/datacrypto/go.sum', 'pkg/events/go.sum', 'pkg/natsruntime/go.sum', 'go.work.sum') }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'authling/mise.toml', 'cli/go.sum', 'authling/go.sum', 'pkg/appconfig/go.sum', 'pkg/datacrypto/go.sum', 'pkg/events/go.sum', 'pkg/natsruntime/go.sum', 'go.work.sum') }}-
          go-build-${{ runner.os }}-${{ runner.arch }}-

    # setup-mise installs mise. It also installs the tools that mise.toml
    # defines (Go, Node), and it caches them.
    - name: Setup mise
      uses: ./.github/actions/setup-mise

    - name: Restore mise task artifacts
      if: inputs.save-task-cache != 'true'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/mise/task-artifacts
        key: mise-task-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'packages/api-types/**/*', 'packages/lingua/**/*', 'apps/frontend/**/*') }}
        restore-keys: |
          mise-task-cache-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore and save mise task artifacts
      # actions/cache keys are immutable: whichever job's post-step saves
      # first under a given key wins it for good, even if that job never
      # ran every cached task. Every job used to run this step unconditionally
      # in parallel, so a job that doesn't need build-frontend (e.g. one that
      # only needs build-api-types/build-lingua) could win the race and
      # permanently freeze out build-frontend's artifact -- a real, measured
      # cause of build-frontend cache misses even on an exact outer-key hit.
      # Restricting the save to this one job, which always runs build-frontend
      # as a real dependency, guarantees the saved cache actually contains it.
      if: inputs.save-task-cache == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/mise/task-artifacts
        key: mise-task-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'packages/api-types/**/*', 'packages/lingua/**/*', 'apps/frontend/**/*') }}
        restore-keys: |
          mise-task-cache-${{ runner.os }}-${{ runner.arch }}-

    # pnpm is not available as a mise plugin, so install via npm (comes with Node)
    - name: Install pnpm
      if: inputs.install-frontend-deps == 'true'
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

    - name: Resolve pnpm store path
      if: inputs.install-frontend-deps == 'true'
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      if: inputs.install-frontend-deps == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'authling/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-

    - name: Install ffmpeg (required for video processing e2e tests)
      if: inputs.install-ffmpeg == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ffmpeg

    - name: Set up Go CLI and shared framework modules
      if: inputs.install-cli-deps == 'true'
      shell: bash
      run: mise setup-go

    - name: Set up frontend and generated packages
      if: inputs.install-frontend-deps == 'true'
      shell: bash
      run: mise setup-web
