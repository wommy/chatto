name: ci

on:
  push:
    branches:
      - main
      - 'release-[0-9]*'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review

concurrency:
  # PRs share a group so superseded revisions are cancelled. Pushes use their
  # immutable commit SHA so every main commit can publish an image.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# NOTE: The docs_website_touched check in the `changes` job uses a narrower
# paths list than `build-docs-image.yml`. The PR build (ci.yml) only checks
# apps/docs-website/ files, while the image publish workflow (build-docs-image.yml)
# also tracks lockfile/package.json changes: [apps/docs-website/**, .npmrc,
# package.json, pnpm-lock.yaml, pnpm-workspace.yaml, LICENSES/Apache-2.0.txt,
# NOTICE]. This is intentional: the PR check verifies the site builds on docs
# changes, while the publish workflow must re-verify on dependency updates.
# Divergence is allowed and deliberate; don't "fix" either list to match.

jobs:
  build-main-image-contexts:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image-version: ${{ steps.image-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Fetch build-version module from workflow commit
        shell: bash
        run: |
          # Fetch the module from the exact commit executing this YAML.
          # $GITHUB_SHA pins the module code to the workflow's own revision,
          # not to a later change on main. This ensures reproducibility:
          # old release-branch builds use the module that shipped with that
          # branch's YAML, not a retargeted newer module from main.
          mkdir -p "$RUNNER_TEMP"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:tools/build-version.mjs" > "$RUNNER_TEMP/build-version.mjs"

      - name: Derive main image version
        id: image-version
        shell: bash
        run: |
          set -euo pipefail

          development_version="$(mise env --json | jq -r '.CHATTO_DEVELOPMENT_VERSION // empty')"
          if [[ -z "$development_version" ]]; then
            echo "::error::Could not read CHATTO_DEVELOPMENT_VERSION from mise.toml."
            exit 1
          fi

          version="$(node "$RUNNER_TEMP/build-version.mjs" --base "$development_version" --sha "$GITHUB_SHA")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and verify versioned frontend
        uses: ./.github/actions/build-versioned-frontend
        with:
          version: ${{ steps.image-version.outputs.version }}

      - name: Build production image contexts
        shell: bash
        env:
          VERSION: ${{ steps.image-version.outputs.version }}
        run: |
          set -euo pipefail

          for arch in amd64 arm64; do
            context=".context/ci/docker/linux-${arch}"
            mkdir -p "$context/docker" "$context/LICENSES"
            cp docker/Dockerfile.goreleaser "$context/Dockerfile"
            cp docker/docker-entrypoint.sh "$context/docker/docker-entrypoint.sh"
            cp docker/nats-wrapper.sh "$context/docker/nats-wrapper.sh"
            cp LICENSES/AGPL-3.0-or-later.txt "$context/LICENSES/AGPL-3.0-or-later.txt"
            cp NOTICE "$context/NOTICE"
            (
              cd cli
              # Chatto does not expose Gin's MessagePack binding; omit its large codec.
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
                -tags=nomsgpack \
                -ldflags="-s -w -X main.Version=${VERSION}" \
                -o "../$context/chatto" .
            )
          done

      - name: Upload production image contexts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-image-contexts
          path: .context/ci/docker
          retention-days: 1

  license-check:
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup mise
        uses: ./.github/actions/setup-mise

      - name: Check license metadata
        run: mise license-check

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup mise
        uses: ./.github/actions/setup-mise

      - name: Check workflows and shell scripts
        run: mise lint-actions

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.check-docs-only.outputs.result }}
      docs_website_touched: ${{ steps.check-docs-only.outputs.docs_website_touched }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check if PR is docs-only
        id: check-docs-only
        shell: bash
        run: |
          set -euo pipefail

          # On push events (main or release-*), always run full CI
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "docs_website_touched=false" >> "$GITHUB_OUTPUT"
            # build-docs-image.yml owns the docs build on push; nothing to gate here.
            exit 0
          fi

          # Fetch base ref for PR comparison
          base_ref="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          git fetch --no-tags --depth=1 origin "${base_ref}:refs/remotes/origin/${base_ref}"

          # Get list of changed files
          changed_files=$(git diff --name-only --no-renames "origin/${base_ref}" HEAD)

          # Allowlist patterns (fail open: any unrecognized file = not docs-only)
          # Patterns matched:
          # - docs/** (documentation files)
          # - **/*.md (markdown files anywhere)
          # - LICENSES/** (license texts)
          # - NOTICE (license notice)
          # - REUSE.toml (REUSE configuration)
          # Empty diff defaults to false (fail open for safety).

          if [[ -z "$changed_files" ]]; then
            # Empty diff is unrecognized, default to not docs-only
            docs_only="false"
          else
            docs_only="true"
            while IFS= read -r file; do
              # Skip empty lines
              [[ -z "$file" ]] && continue

              # Check if file matches allowlist
              if [[ "$file" =~ ^docs/ ]] || \
                 [[ "$file" =~ \.md$ ]] || \
                 [[ "$file" =~ ^LICENSES/ ]] || \
                 [[ "$file" == "NOTICE" ]] || \
                 [[ "$file" == "REUSE.toml" ]]; then
                continue
              else
                # File doesn't match allowlist - not docs-only
                docs_only="false"
                echo "::notice::Not docs-only: ${file}"
                break
              fi
            done <<< "$changed_files"
          fi

          echo "result=$docs_only" >> "$GITHUB_OUTPUT"

          # Check if any changed files are in apps/docs-website/. Computed
          # separately from docs_only because the docs_only loop breaks on first
          # non-allowlisted file; this grep checks the full list so a PR touching
          # cli/x.go then apps/docs-website/y.mdx correctly identifies docs changes.
          if grep -qE '^apps/docs-website/' <<< "$changed_files"; then
            docs_website_touched="true"
          else
            docs_website_touched="false"
          fi
          echo "docs_website_touched=$docs_website_touched" >> "$GITHUB_OUTPUT"

  docs-website-build:
    # Job-level if: ensures this job reports "skipped" (not "absent") on
    # unrelated PRs. A skipped required check passes; an absent one would block
    # every unrelated pull request forever. This is why the job is in ci.yml
    # with a job-level condition, not a separate workflow with paths: filters.
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_website_touched == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-cli-deps: "false"

      - name: Build documentation site
        run: mise docs-website-build

  desktop:
    name: desktop (${{ matrix.platform }})
    if: needs.changes.outputs.docs_only != 'true'
    needs: [changes]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            artifact-path: apps/desktop/dist/chatto-desktop
          - platform: macos
            os: macos-15
            artifact-path: apps/desktop/dist/Chatto Desktop.app
          - platform: windows
            os: windows-latest
            artifact-path: apps/desktop/dist/windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-cli-deps: "false"

      - name: Check and test desktop shell
        run: mise test-desktop

      - name: Build desktop bundle
        run: mise desktop-build

      - name: Verify desktop bundle exists
        shell: bash
        env:
          ARTIFACT_PATH: ${{ matrix.artifact-path }}
        run: test -e "$ARTIFACT_PATH"

      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 "apps/desktop/dist/Chatto Desktop.app"

      - name: Verify macOS game-capture helper
        if: runner.os == 'macOS'
        shell: bash
        run: |
          helper="apps/desktop/dist/Chatto Desktop.app/Contents/Helpers/Chatto Capture Helper.app/Contents/MacOS/chatto-macos-capture-probe"
          test -x "$helper"
          "$helper" help | grep -F 'publish --window'
          otool -l "$helper" | grep -F '@executable_path/../Frameworks'

      - name: Upload desktop bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chatto-desktop-${{ matrix.platform }}-${{ runner.arch }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 7

  desktop-macos-capture:
    if: needs.changes.outputs.docs_only != 'true'
    needs: [changes]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Test macOS game-capture helper
        run: tools/test-desktop-macos-capture.sh

  codegen-proto-drift:
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Fetch protobuf breaking base
        run: |
          base_ref="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          git fetch --no-tags --depth=1 origin "${base_ref}:refs/remotes/origin/${base_ref}"

      - name: Check storage, internal, and Operator protobuf breaking changes
        run: |
          base_ref="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          mise x -- node tools/check-storage-proto-breaking.mjs \
            "../.git#branch=origin/${base_ref},subdir=proto"

      - name: Check projection snapshot schema contracts
        working-directory: cli
        run: mise x -- go test ./internal/core -run TestProjectionSnapshotContractsIncludeCurrentSchema -count=1

      - name: Check public API protobuf breaking changes
        if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'api-breaking-change') }}
        run: |
          base_ref="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          cd proto
          mise x -- buf breaking . --against "../.git#branch=origin/${base_ref},subdir=proto" \
            --path chatto/auth/v1 \
            --path chatto/discovery/v1 \
            --path chatto/api/v1 \
            --path chatto/admin/v1 \
            --path chatto/realtime/v1 \
            --path chatto/core/live/v1/live_events.proto

      - name: Check Authling persisted protobuf breaking changes
        run: |
          base_ref="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          if git cat-file -e "origin/${base_ref}:authling/buf.yaml" 2>/dev/null; then
            cd authling
            mise x -- buf breaking . \
              --against "../.git#branch=origin/${base_ref},subdir=authling" \
              --exclude-imports
          else
            echo "::notice::Authling protobufs are new; no base schema exists yet."
          fi

      - name: Acknowledge intentional public API protobuf breaking changes
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'api-breaking-change') }}
        run: |
          echo "::notice::Skipping public and transient-wire Buf breaking checks because this PR has the api-breaking-change label. Storage, internal, Operator, and codegen drift checks still run."

      - name: Lint Authling protobufs
        working-directory: authling
        run: mise x -- buf lint

      - name: Regenerate protobuf bindings
        run: |
          mise codegen-proto
          cd authling
          mise codegen-proto

      - name: Check generated protobuf bindings are current
        run: |
          if ! git diff --exit-code; then
            git status --short
            exit 1
          fi

  check-workspace:
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-cli-deps: "false"

      - name: Run workspace typechecks
        run: pnpm run check

      - name: Run workspace linters
        run: pnpm run lint

      - name: Build Storybook design-system catalog
        run: pnpm run build:storybook

  test-workspace:
    # Keep this job name stable because it can be a required branch check.
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-cli-deps: "false"

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 15
        with:
          save-cache: "true"

      - name: Run workspace unit tests
        run: pnpm test

  test-cli:
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          # PR caches are isolated from main and cannot accelerate a merge run.
          save-go-build-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Run Authling tests
        working-directory: authling
        run: mise test

      - name: Run application configuration tests
        run: mise test-appconfig

      - name: Run data cryptography tests
        run: mise test-datacrypto

      - name: Run event framework tests
        run: mise test-events

      - name: Run embedded NATS runtime tests
        run: mise test-natsruntime

      - name: Run CLI tests
        env:
          CHATTO_GO_TEST_P: "1"
        run: mise test-cli

  test-authling-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Setup Authling E2E dependencies
        working-directory: authling
        run: |
          mise install
          mise deps-web

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 15
        with:
          working-directory: authling

      - name: Run Authling E2E tests
        working-directory: authling
        run: mise test-e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() }}
        with:
          name: authling-playwright-report
          path: |
            authling/playwright-report/
            authling/test-results/
          retention-days: 14

  test-e2e:
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: test-e2e (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 15

      - name: Build E2E server
        run: mise build-e2e-server

      - name: Run E2E tests
        run: mise test-e2e -- --grep-invert @ffmpeg --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.shard }}-of-4
          path: apps/frontend/playwright-report/
          retention-days: 14

  test-e2e-media:
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup environment
        uses: ./.github/actions/setup
        timeout-minutes: 15
        with:
          install-ffmpeg: "true"

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 15

      - name: Build E2E server
        run: mise build-e2e-server

      - name: Run media E2E tests
        run: mise test-e2e -- --grep @ffmpeg

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() }}
        with:
          name: playwright-report-media
          path: apps/frontend/playwright-report/
          retention-days: 14

  test-e2e-performance:
    if: needs.changes.outputs.docs_only != 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 15

      - name: Prepare performance baseline
        id: performance-baseline
        shell: bash
        env:
          PERFORMANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/chatto-performance-base"
          if [[ -z "$PERFORMANCE_BASE_SHA" || "$PERFORMANCE_BASE_SHA" =~ ^0+$ ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${PERFORMANCE_BASE_SHA}:apps/frontend/e2e-performance/large-server.performance.test.ts"; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git worktree add --detach "$baseline_dir" "$PERFORMANCE_BASE_SHA"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Run base-revision performance test
        id: performance-baseline-test
        if: steps.performance-baseline.outputs.available == 'true'
        working-directory: ${{ runner.temp }}/chatto-performance-base
        continue-on-error: true
        run: mise test-e2e-performance

      - name: Preserve base-revision results
        if: steps.performance-baseline.outputs.available == 'true' && steps.performance-baseline-test.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          comparison_dir="apps/frontend/test-results/performance-comparison"
          mkdir -p "$comparison_dir"
          base_result=$(find "$RUNNER_TEMP/chatto-performance-base/apps/frontend/test-results/performance" -name performance-results.json -print -quit)
          cp "$base_result" "$comparison_dir/base.json"
          cp -R "$RUNNER_TEMP/chatto-performance-base/apps/frontend/playwright-report-performance" apps/frontend/playwright-report-performance-base

      - name: Build E2E server
        run: mise build-e2e-server

      - name: Run large-server E2E performance test
        run: mise test-e2e-performance

      - name: Preserve candidate results
        shell: bash
        run: |
          set -euo pipefail
          comparison_dir="apps/frontend/test-results/performance-comparison"
          mkdir -p "$comparison_dir"
          candidate_result=$(find apps/frontend/test-results/performance -name performance-results.json -print -quit)
          cp "$candidate_result" "$comparison_dir/candidate.json"

      - name: Compare performance with base revision
        if: steps.performance-baseline.outputs.available == 'true' && steps.performance-baseline-test.outcome == 'success'
        working-directory: apps/frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/compare-e2e-performance.mjs \
            test-results/performance-comparison/base.json \
            test-results/performance-comparison/candidate.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summarize candidate-only performance results
        if: steps.performance-baseline.outputs.available != 'true' || steps.performance-baseline-test.outcome == 'failure'
        shell: bash
        run: |
          result="apps/frontend/test-results/performance-comparison/candidate.json"
          {
            echo "## Large-server E2E performance"
            if [[ "${{ steps.performance-baseline-test.outcome }}" == 'failure' ]]; then
              echo "> Warning: The base-revision benchmark failed, so these candidate results are not compared with the base revision."
              echo ""
            fi
            jq -r '"Fixture: \(.measurements.syntheticUsers) users, \(.measurements.messages) messages; \(.measurements.sampleCount)-sample medians (\(.measurements.startupMode) startup)"' "$result"
            echo ""
            echo "| Measurement | Duration (ms) |"
            echo "| --- | ---: |"
            jq -r '.measurements | to_entries[] | select(.key | endswith("Ms")) | "| \(.key) | \(.value | round) |"' "$result"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove performance baseline worktree
        if: ${{ always() && steps.performance-baseline.outputs.available == 'true' }}
        shell: bash
        run: git worktree remove --force "$RUNNER_TEMP/chatto-performance-base"

      - name: Upload performance results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: e2e-performance-results
          path: |
            apps/frontend/test-results/performance/
            apps/frontend/test-results/performance-comparison/
            apps/frontend/playwright-report-performance/
            apps/frontend/playwright-report-performance-base/
          retention-days: 30

  publish-main-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-main-image-contexts
      - license-check
      - workflow-lint
      - codegen-proto-drift
      - check-workspace
      - test-workspace
      - test-cli
      - test-e2e
      - test-e2e-media
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download production image contexts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-image-contexts
          path: docker-contexts

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive immutable main image tag
        id: main-image
        shell: bash
        run: echo "tag=main-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build and push amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker-contexts/linux-amd64
          file: docker-contexts/linux-amd64/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/chattocorp/chatto:${{ github.sha }}-amd64
          cache-from: type=gha,scope=chatto-main-amd64
          cache-to: type=gha,scope=chatto-main-amd64,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/chattocorp/chatto
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build-main-image-contexts.outputs.image-version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push arm64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker-contexts/linux-arm64
          file: docker-contexts/linux-arm64/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/chattocorp/chatto:${{ github.sha }}-arm64
          cache-from: type=gha,scope=chatto-main-arm64
          cache-to: type=gha,scope=chatto-main-arm64,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/chattocorp/chatto
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build-main-image-contexts.outputs.image-version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Publish multi-platform commit image
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/chattocorp/chatto:${GITHUB_SHA}" \
            --tag "ghcr.io/chattocorp/chatto:${{ steps.main-image.outputs.tag }}" \
            "ghcr.io/chattocorp/chatto:${GITHUB_SHA}-amd64" \
            "ghcr.io/chattocorp/chatto:${GITHUB_SHA}-arm64"

          {
            echo "### Main commit image"
            echo
            echo "\`ghcr.io/chattocorp/chatto:${GITHUB_SHA}\`"
            echo "\`ghcr.io/chattocorp/chatto:${{ steps.main-image.outputs.tag }}\`"
            echo
            echo "Version: \`${{ needs.build-main-image-contexts.outputs.image-version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
