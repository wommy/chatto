name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches:
      - main
      - 'release-[0-9]*'
  push:
    tags:
      - "v*"
      - "chatto-desktop/v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Artifact to build"
        required: true
        default: image
        type: choice
        options:
          - image
          - desktop
      ref:
        description: "Git ref or SHA to build. Defaults to the selected workflow ref."
        required: false
        type: string

permissions:
  contents: read

# The release-please configuration and manifest paths. The release-please
# action reads them, and tools/verify-release-tag.mjs derives the files that a
# release commit may change from the configuration, so both jobs need them.
env:
  CONFIG_FILE: .release-please-config.json
  MANIFEST_FILE: .release-please-manifest.json

jobs:
  release-please:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-please-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    env:
      TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
          config-file: ${{ env.CONFIG_FILE }}
          manifest-file: ${{ env.MANIFEST_FILE }}
          target-branch: ${{ env.TARGET_BRANCH }}

  build-image:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'image' }}
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Fetch build-version module from workflow commit
        shell: bash
        run: |
          # Fetch the module from the exact commit executing this YAML.
          # $GITHUB_SHA pins the module code to the workflow's own revision,
          # not to a later change on main. This ensures reproducibility:
          # old release-branch builds use the module that shipped with that
          # branch's YAML, not a retargeted newer module from main.
          mkdir -p "$RUNNER_TEMP"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:tools/build-version.mjs" > "$RUNNER_TEMP/build-version.mjs"

      - name: Resolve image metadata
        id: image
        run: |
          set -euo pipefail

          sha="$(git rev-parse HEAD)"
          development_version="$(mise env --json | jq -r '.CHATTO_DEVELOPMENT_VERSION // empty')"
          if [[ -z "$development_version" ]]; then
            echo "::error::CHATTO_DEVELOPMENT_VERSION is not set. This ref's mise.toml must define this variable."
            exit 1
          fi

          version="$(node "$RUNNER_TEMP/build-version.mjs" --base "$development_version" --sha "$sha")"

          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          {
            echo "### Image"
            echo
            echo "- Commit: \`${sha}\`"
            echo "- Version: \`${version}\`"
            echo "- Image: \`ghcr.io/chattocorp/chatto:${sha}\`"
            echo "- Platform: \`linux/amd64\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend assets for CLI image
        run: mise build-frontend
        env:
          CHATTO_BUILD_VERSION: ${{ steps.image.outputs.version }}
          CHATTO_FRONTEND_PRECOMPRESS: "1"

      - name: Prepare Docker context
        env:
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail

          context="/tmp/chatto-docker/linux-amd64"
          mkdir -p "$context"
          cp docker/Dockerfile.goreleaser "$context/Dockerfile"
          mkdir -p "$context/docker"
          cp docker/docker-entrypoint.sh "$context/docker/docker-entrypoint.sh"
          cp docker/nats-wrapper.sh "$context/docker/nats-wrapper.sh"
          mkdir -p "$context/LICENSES"
          cp LICENSES/AGPL-3.0-or-later.txt "$context/LICENSES/AGPL-3.0-or-later.txt"
          cp NOTICE "$context/NOTICE"

          (
            cd cli
            # Chatto does not expose Gin's MessagePack binding; omit its large codec.
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
              -tags=nomsgpack \
              -ldflags="-s -w -X main.Version=${VERSION}" \
              -o "$context/chatto" .
          )

      - name: Build and push Chatto image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: /tmp/chatto-docker/linux-amd64
          file: /tmp/chatto-docker/linux-amd64/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/chattocorp/chatto:${{ steps.image.outputs.sha }}
          cache-from: type=gha,scope=chatto-manual-amd64
          cache-to: type=gha,mode=max,scope=chatto-manual-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/chattocorp/chatto
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

  build-desktop-release:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/chatto-desktop/v')) || (github.event_name == 'workflow_dispatch' && inputs.target == 'desktop') }}
    name: build-desktop-release (${{ matrix.platform }})
    environment: ${{ matrix.environment }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            environment: desktop-signing
          - platform: macos
            os: macos-15
            environment: desktop-signing
          - platform: windows
            os: windows-latest
            environment: desktop-windows-signing
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Verify trusted desktop ref
        shell: bash
        run: node apps/desktop/scripts/release-ref-checks.mjs verify-trusted-ref

      - name: Verify immutable GitHub OIDC subject
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SUBJECT_PREFIX: repo:chattocorp@261891647/chatto@1205013299
        run: node apps/desktop/scripts/release-ref-checks.mjs verify-oidc-subject

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-cli-deps: "false"

      - name: Fetch build-version module from workflow commit
        shell: bash
        run: |
          # Fetch the module from the exact commit executing this YAML.
          # $GITHUB_SHA pins the module code to the workflow's own revision,
          # not to a later change on main. This ensures reproducibility:
          # old release-branch builds use the module that shipped with that
          # branch's YAML, not a retargeted newer module from main.
          mkdir -p "$RUNNER_TEMP"
          # Skip fetch if ref already exists locally (e.g., from fetch-depth: 0).
          git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null || git fetch --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:tools/build-version.mjs" > "$RUNNER_TEMP/build-version.mjs"

      - name: Resolve desktop version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#chatto-desktop/v}"
          else
            version="$(jq -r '.version' apps/desktop/package.json)"
          fi
          sha="$(git rev-parse HEAD)"

          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "::error::Could not determine the Chatto Desktop version."
            exit 1
          fi
          if [[ -z "$sha" ]]; then
            echo "::error::Could not determine the checked-out commit."
            exit 1
          fi

          frontend_version="$(node "$RUNNER_TEMP/build-version.mjs" --base "$version" --sha "$sha")"
          {
            echo "version=${version}"
            echo "sha=${sha}"
            echo "frontend_version=${frontend_version}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Chatto Desktop"
            echo
            echo "- Commit: \`${sha}\`"
            echo "- Desktop version: \`${version}\`"
            echo "- Bundled frontend version: \`${frontend_version}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check and test desktop shell
        run: mise test-desktop

      - name: Test macOS game-capture helper
        if: runner.os == 'macOS'
        run: mise test-desktop-macos-capture

      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.CHATTO_MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CHATTO_MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_BASE64: ${{ secrets.CHATTO_MACOS_NOTARY_API_KEY_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.CHATTO_MACOS_NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.CHATTO_MACOS_NOTARY_API_ISSUER_ID }}
        run: mise x -- node apps/desktop/scripts/macos-keychain.mjs provision >> "$GITHUB_ENV"

      - name: Validate Windows signing configuration
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CHATTO_WINDOWS_AZURE_CLIENT_ID: ${{ secrets.CHATTO_WINDOWS_AZURE_CLIENT_ID }}
          CHATTO_WINDOWS_AZURE_TENANT_ID: ${{ secrets.CHATTO_WINDOWS_AZURE_TENANT_ID }}
          CHATTO_WINDOWS_AZURE_SUBSCRIPTION_ID: ${{ secrets.CHATTO_WINDOWS_AZURE_SUBSCRIPTION_ID }}
          CHATTO_WINDOWS_SIGNING_ENDPOINT: ${{ vars.CHATTO_WINDOWS_SIGNING_ENDPOINT }}
          CHATTO_WINDOWS_SIGNING_ACCOUNT_NAME: ${{ vars.CHATTO_WINDOWS_SIGNING_ACCOUNT_NAME }}
          CHATTO_WINDOWS_CERTIFICATE_PROFILE_NAME: ${{ vars.CHATTO_WINDOWS_CERTIFICATE_PROFILE_NAME }}
          CHATTO_WINDOWS_EXPECTED_PUBLISHER: ${{ vars.CHATTO_WINDOWS_EXPECTED_PUBLISHER }}
        run: mise x -- node apps/desktop/scripts/windows-signing.mjs check-settings

      - name: Build desktop bundle
        shell: bash
        env:
          CHATTO_BUILD_VERSION: ${{ steps.version.outputs.frontend_version }}
          DEBUG: ${{ runner.os == 'macOS' && 'electron-notarize*' || '' }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            mise desktop-build 2>&1 | tee "$RUNNER_TEMP/chatto-macos-notarization.log"
          else
            mise desktop-build
          fi

      - name: Log in to Azure for Windows signing
        if: runner.os == 'Windows'
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.CHATTO_WINDOWS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CHATTO_WINDOWS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CHATTO_WINDOWS_AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows desktop bundle
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.CHATTO_WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.CHATTO_WINDOWS_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.CHATTO_WINDOWS_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\apps\desktop\dist\windows
          files-folder-filter: exe,dll,node
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Chatto Desktop
          description-url: https://chatto.run

      - name: Verify bundled frontend version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.frontend_version }}
        run: |
          jq -e --arg expected "$EXPECTED_VERSION" \
            '.version == $expected' \
            apps/frontend/build/_app/version.json

      - name: Verify Windows bundle signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CHATTO_WINDOWS_EXPECTED_PUBLISHER: ${{ vars.CHATTO_WINDOWS_EXPECTED_PUBLISHER }}
        run: |
          # Collect the signature records only. windows-signing.mjs decides
          # which record passes, and it has a test beside it.
          $bundle = Resolve-Path "apps/desktop/dist/windows"
          $application = Join-Path $bundle "chatto-desktop.exe"
          $report = [ordered]@{
            mainBinaryPath = $application
            mainBinaryPresent = [bool](Test-Path -LiteralPath $application -PathType Leaf)
            files = @(Get-ChildItem -LiteralPath $bundle -File -Recurse |
              Where-Object { $_.Extension -in '.exe', '.dll', '.node' } |
              ForEach-Object {
                $signature = Get-AuthenticodeSignature -LiteralPath $_.FullName
                [ordered]@{
                  fullName = $_.FullName
                  status = [string]$signature.Status
                  publisher = $signature.SignerCertificate.Subject
                  hasTimestamp = $null -ne $signature.TimeStamperCertificate
                }
              })
          }
          $reportPath = Join-Path $env:RUNNER_TEMP "windows-signature-report.json"
          [System.IO.File]::WriteAllText($reportPath, ($report | ConvertTo-Json -Depth 4))
          mise x -- node apps/desktop/scripts/windows-signing.mjs verify-signatures $reportPath

      - name: Package macOS release
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: mise x -- node apps/desktop/scripts/desktop-packaging.mjs package-macos

      - name: Upload macOS notarisation log
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-notarisation-log-${{ github.run_id }}-${{ runner.arch }}
          path: ${{ runner.temp }}/chatto-macos-notarization.log
          if-no-files-found: warn
          retention-days: 90

      - name: Remove macOS signing credentials
        if: runner.os == 'macOS' && always()
        shell: bash
        run: mise x -- node apps/desktop/scripts/macos-keychain.mjs cleanup

      - name: Package Linux release
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p .context/desktop-release
          tar -C apps/desktop/dist -czf \
            ".context/desktop-release/chatto-desktop_${VERSION}_Linux_${RUNNER_ARCH}.tar.gz" \
            chatto-desktop

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: mise x -- node apps/desktop/scripts/desktop-packaging.mjs package-windows

      - name: Upload desktop release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release-${{ matrix.platform }}-${{ runner.arch }}
          path: .context/desktop-release
          if-no-files-found: error
          retention-days: 1

  assemble-desktop-release:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/chatto-desktop/v')) || (github.event_name == 'workflow_dispatch' && inputs.target == 'desktop') }}
    needs: build-desktop-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-release-*
          path: .context/desktop-release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd .context/desktop-release
          sha256sum chatto-desktop_* > chatto-desktop_checksums.txt

      - name: Upload desktop release verification
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release-verification-${{ github.run_id }}
          path: .context/desktop-release
          if-no-files-found: error
          retention-days: 1

      - name: Upload and publish desktop release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" .context/desktop-release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      is_stable: ${{ steps.release_meta.outputs.is_stable }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Fetch release branches
        run: git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release-*:refs/remotes/origin/release-*'

      # tools/verify-release-tag.mjs owns the gate: which commits may
      # release, and whether this release may move `latest`. Its test runs on
      # every pull request against Git fixture repositories, so the rules are
      # proven before the tag that acts on them. This step runs before the
      # environment setup, so it uses the Node of the runner.
      - name: Verify release-please tag
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail

          node tools/verify-release-tag.mjs \
            --tag "$GITHUB_REF_NAME" \
            --config "$CONFIG_FILE" \
            --manifest "$MANIFEST_FILE" | tee -a "$GITHUB_OUTPUT"

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build frontend once
        run: mise build-frontend
        env:
          CHATTO_BUILD_VERSION: ${{ steps.version.outputs.version }}
          CHATTO_FRONTEND_PRECOMPRESS: "1"

      # Verify that the frontend build received the correct version before GoReleaser
      # packages it into the server binary and client image. The bundled version must
      # match the release tag, not the npm_package_version fallback.
      - name: Verify bundled frontend version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq -e --arg expected "$EXPECTED_VERSION" \
            '.version == $expected' \
            apps/frontend/build/_app/version.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tools/release-image-tags.mjs owns the tag policy for both images. Its
      # test runs on every pull request, so the decision is proven before the
      # push that acts on it. `tee` keeps the complete plan in the job log.
      - name: Resolve release image tags
        id: image_tags
        shell: bash
        env:
          PUSH_LATEST: ${{ steps.release_meta.outputs.push_latest }}
        run: |
          set -euo pipefail

          mise x -- node tools/release-image-tags.mjs \
            --tag "$GITHUB_REF_NAME" \
            --push-latest "$PUSH_LATEST" | tee -a "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Use a PAT so the release is authored by a user account rather
          # than github-actions[bot]. Bot-authored releases don't get
          # GitHub's autolink rendering for commit SHAs and #NNN PR refs.
          GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
          # .goreleaser.yml reads these three and decides nothing itself. All
          # three must be set: GoReleaser templates use missingkey=error.
          CHATTO_SKIP_PUSH_MAJOR_MINOR: ${{ steps.image_tags.outputs.chatto_skip_push_major_minor }}
          CHATTO_SKIP_PUSH_LATEST: ${{ steps.image_tags.outputs.chatto_skip_push_latest }}
          CHATTO_SKIP_PUSH_NEXT: ${{ steps.image_tags.outputs.chatto_skip_push_next }}

      # Only the immutable {version} tag is pushed here. The floating tags
      # move in the last step of this job, after the smoke check proved that
      # this image works and after the GitHub Release published. Issue #38
      # holds the decision.
      - name: Build and push frontend Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.frontend.prebuilt
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image_tags.outputs.client_version_tag }}
          cache-from: type=gha,scope=chatto-client
          cache-to: type=gha,scope=chatto-client,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/chattocorp/chatto
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      # tools/smoke-check-image.mjs pulls the image that was pushed above and
      # proves that it starts and carries the bundle of this release. Its unit
      # tests run on every pull request; the container path first runs here.
      # The `release` job sets no timeout, so this step sets its own, and the
      # module bounds its own attempts as well.
      - name: Smoke check the client image
        shell: bash
        timeout-minutes: 10
        env:
          CLIENT_VERSION_TAG: ${{ steps.image_tags.outputs.client_version_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          mise x -- node tools/smoke-check-image.mjs \
            --image "$CLIENT_VERSION_TAG" \
            --port 80 \
            --probe-path / \
            --expect-version "$VERSION"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          gh release edit "v${VERSION}" \
            --repo chattocorp/chatto \
            --draft=false

      # `release_meta` classified this version with the one parser that the
      # repository uses. A substring test for `-` here disagreed with that
      # parser for a version that carries build metadata.
      - name: Update Homebrew tap
        if: ${{ steps.release_meta.outputs.is_stable == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -z "${HOMEBREW_TAP_GITHUB_TOKEN:-}" ]]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is required to update chattocorp/homebrew-tap."
            exit 1
          fi

          workdir="$(mktemp -d)"
          checksums="${workdir}/chatto_${VERSION}_checksums.txt"

          gh release download "v${VERSION}" \
            --repo chattocorp/chatto \
            --pattern "chatto_${VERSION}_checksums.txt" \
            --dir "${workdir}"

          checksum_for() {
            awk -v artifact="$1" '$2 == artifact { print $1 }' "${checksums}"
          }

          darwin_arm64_sha="$(checksum_for chatto_Darwin_arm64.tar.gz)"
          linux_arm64_sha="$(checksum_for chatto_Linux_arm64.tar.gz)"
          linux_x86_64_sha="$(checksum_for chatto_Linux_x86_64.tar.gz)"

          for checksum in darwin_arm64_sha linux_arm64_sha linux_x86_64_sha; do
            if [[ -z "${!checksum}" ]]; then
              echo "::error::Missing ${checksum} in ${checksums}."
              exit 1
            fi
          done

          tap_dir="${workdir}/homebrew-tap"
          git clone "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/chattocorp/homebrew-tap.git" "${tap_dir}"

          mkdir -p "${tap_dir}/Formula"
          cat > "${tap_dir}/Formula/chatto.rb" <<FORMULA
          class Chatto < Formula
            desc "Real-time chat app CLI and server"
            homepage "https://github.com/chattocorp/chatto"
            version "${VERSION}"
            license "AGPL-3.0-or-later"

            on_macos do
              on_arm do
                url "https://github.com/chattocorp/chatto/releases/download/v#{version}/chatto_Darwin_arm64.tar.gz"
                sha256 "${darwin_arm64_sha}"
              end

              on_intel do
                odie "Chatto currently provides Homebrew builds for Apple Silicon macOS only."
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/chattocorp/chatto/releases/download/v#{version}/chatto_Linux_arm64.tar.gz"
                sha256 "${linux_arm64_sha}"
              end

              on_intel do
                url "https://github.com/chattocorp/chatto/releases/download/v#{version}/chatto_Linux_x86_64.tar.gz"
                sha256 "${linux_x86_64_sha}"
              end
            end

            def install
              bin.install "chatto"
              system "codesign", "--force", "--sign", "-", bin/"chatto" if OS.mac?
            end

            test do
              assert_match "chatto version #{version}", shell_output("#{bin}/chatto version")
            end
          end
          FORMULA

          git -C "${tap_dir}" config user.name "github-actions[bot]"
          git -C "${tap_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git -C "${tap_dir}" diff --quiet -- Formula/chatto.rb; then
            echo "Homebrew tap already contains Chatto ${VERSION}."
            exit 0
          fi

          git -C "${tap_dir}" add Formula/chatto.rb
          git -C "${tap_dir}" commit -m "chore: update chatto to v${VERSION}"
          git -C "${tap_dir}" push origin HEAD:main

      # The last step of the release moves the client image floating tags.
      # Any earlier failure means this step never runs, the job is red, and
      # `chatto-client:latest` keeps the previous release serving.
      #
      # `imagetools create` copies the manifest that the smoke check tested,
      # so the tag points at the digest that was checked. A second
      # `build-push-action` would push a new manifest instead, and nothing
      # would tie that manifest to the checked image. The same command moves a
      # tag back, so the rollback is the mechanism that each release exercises.
      # `docs/RELEASING.md` holds the recovery.
      - name: Move the client image floating tags
        shell: bash
        timeout-minutes: 10
        env:
          CLIENT_VERSION_TAG: ${{ steps.image_tags.outputs.client_version_tag }}
          CLIENT_FLOATING_TAGS: ${{ steps.image_tags.outputs.client_floating_tags }}
        run: |
          set -euo pipefail

          floating=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && floating+=("$tag")
          done <<< "$CLIENT_FLOATING_TAGS"

          if (( ${#floating[@]} == 0 )); then
            echo "This release publishes no floating client tag."
            exit 0
          fi

          # Write the rollback command for each tag before it moves. An
          # operator then finds the previous digest in this job log.
          digest_of() {
            printf '%s\n' "$1" |
              awk '/^Digest:/ { if (!found) { print $2; found = 1 } }'
          }

          repository="${CLIENT_VERSION_TAG%:*}"
          for tag in "${floating[@]}"; do
            if inspected="$(docker buildx imagetools inspect "$tag" 2>/dev/null)"; then
              previous="$(digest_of "$inspected")"
              echo "Roll ${tag} back with:"
              echo "  docker buildx imagetools create --tag ${tag} ${repository}@${previous}"
            else
              echo "${tag} does not exist yet, so it has no previous digest."
            fi
          done

          create=()
          for tag in "${floating[@]}"; do
            create+=(--tag "$tag")
          done

          docker buildx imagetools create "${create[@]}" "$CLIENT_VERSION_TAG"

          # The assignment makes a failed read of the moved tag red. To put
          # the command in the `echo` arguments would hide that failure.
          for tag in "${floating[@]}"; do
            moved="$(docker buildx imagetools inspect "$tag")"
            echo "${tag} now holds $(digest_of "$moved")"
          done

  publish-stable-docs:
    needs: release
    if: ${{ github.event_name == 'push' && needs.release.outputs.is_stable == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-docs-image.yml
    with:
      channel: stable
      ref: ${{ github.ref }}
    secrets: inherit
