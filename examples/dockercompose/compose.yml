services:
  nats:
    image: nats:latest
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data", "-c=/etc/nats-server/nats.conf"]
    volumes:
      - nats_data:/data
      # Mount NATS config from Secret to avoid token exposure via /proc/<pid>/cmdline
      - ./nats.conf:/etc/nats-server/nats.conf:ro

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command:
      - --config
      - /etc/livekit.yaml
    ports:
      - "7882:7882/udp"  # WebRTC media (UDP, must be direct)
      - "7881:7881/tcp"  # WebRTC media fallback when UDP is unavailable
      - "3478:3478/udp"  # TURN/STUN relay for NAT traversal
    expose:
      - "7880"  # WebSocket signaling (proxied through Caddy)
    volumes:
      - ${LIVEKIT_CONFIG_FILE:-./livekit.yaml}:/etc/livekit.yaml:ro

  chatto:
    image: ghcr.io/chattocorp/chatto:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    depends_on:
      - nats
    expose:
      - "4000"

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_URL: "${PUBLIC_URL:-chat.example.com}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  nats_data:
  caddy_data:
  caddy_config:
