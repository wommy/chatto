version: 2
project_name: chatto

builds:
  - env:
      - CGO_ENABLED=0
    dir: ./cli
    goos:
      - linux
      - freebsd
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    flags:
      - -trimpath
    # Keep the nomsgpack tag on this build. It must agree with the other
    # Chatto binary builds. The Build section of mise.toml gives the reason.
    tags:
      - nomsgpack
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    files:
      - LICENSES/AGPL-3.0-or-later.txt
      - NOTICE
    # this name template makes the OS and Arch compatible with the results of `uname`.
    # GoReleaser's `title` renders `freebsd` as `Freebsd`, but `uname` reports `FreeBSD`.
    name_template: >-
      {{ .ProjectName }}_
      {{- if eq .Os "freebsd" }}FreeBSD{{ else }}{{ title .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # Use native ZIP archives for Windows releases.
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  # release-please now owns the changelog (CHANGELOG.md + the GitHub
  # Release body). Don't let GoReleaser generate or attach a second one.
  disable: true

dockers:
  - image_templates:
      - "ghcr.io/chattocorp/chatto:{{ .Version }}-amd64"
    dockerfile: docker/Dockerfile.goreleaser
    extra_files:
      - docker/docker-entrypoint.sh
      - docker/nats-wrapper.sh
      - LICENSES/AGPL-3.0-or-later.txt
      - NOTICE
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
      - "--cache-from=type=gha,scope=chatto-backend-amd64"
      - "--cache-to=type=gha,scope=chatto-backend-amd64,mode=max"
      - "--label=org.opencontainers.image.source=https://github.com/chattocorp/chatto"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.licenses=AGPL-3.0-or-later"
    use: buildx
    goarch: amd64
    goos: linux
  - image_templates:
      - "ghcr.io/chattocorp/chatto:{{ .Version }}-arm64"
    dockerfile: docker/Dockerfile.goreleaser
    extra_files:
      - docker/docker-entrypoint.sh
      - docker/nats-wrapper.sh
      - LICENSES/AGPL-3.0-or-later.txt
      - NOTICE
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
      - "--cache-from=type=gha,scope=chatto-backend-arm64"
      - "--cache-to=type=gha,scope=chatto-backend-arm64,mode=max"
      - "--label=org.opencontainers.image.source=https://github.com/chattocorp/chatto"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.licenses=AGPL-3.0-or-later"
    use: buildx
    goarch: arm64
    goos: linux

docker_manifests:
  # Always: the fully-qualified version tag (e.g. 0.0.190, 0.1.0-alpha.1).
  # This is the one manifest GoReleaser actually publishes. It is both the
  # immutable tag operators pin to and the source that `docker buildx
  # imagetools create` copies from when the release workflow moves a
  # floating tag onto it.
  - name_template: "ghcr.io/chattocorp/chatto:{{ .Version }}"
    image_templates:
      - "ghcr.io/chattocorp/chatto:{{ .Version }}-amd64"
      - "ghcr.io/chattocorp/chatto:{{ .Version }}-arm64"

  # Every floating manifest below carries skip_push: "true" as a literal
  # string, unconditionally. Issue #52: GoReleaser is the wrong place to
  # decide whether a floating tag moves, because nothing evaluates a
  # GoReleaser template before the push that acts on it (the manifest pipe
  # has a Publish method and no Run method, and `goreleaser check` evaluates
  # no templates), and because GoReleaser pushes before the release workflow
  # creates the GitHub Release, so `skip_push` cannot gate on release success
  # either way. `:latest` is the least withdrawable reference this release
  # publishes, so it must not move except through a step this repository can
  # test and that can fail loud.
  #
  # tools/release-image-tags.mjs still holds the one answer to "which tags
  # does this release publish?" for the server image. The release workflow
  # reads its `server_floating_tags` output and moves the answer with `docker
  # buildx imagetools create`, after a smoke check proves the version image
  # that skip_push left untouched, and after the GitHub Release publishes.
  # `docs/RELEASING.md` documents that order and its recovery command.
  #
  # Note the exact semantics: after the template renders and is trimmed, only
  # the literal string `true` counts (GoReleaser compares the rendered value,
  # so `True`, `1`, and `yes` do not skip the push). A bare `"true"` needs no
  # template at all, which is why these read as plain strings and not
  # `'{{ .Env... }}'` variables.

  # Stable only: the Major.Minor floater.
  - name_template: "ghcr.io/chattocorp/chatto:{{ .Major }}.{{ .Minor }}"
    skip_push: "true"
    image_templates:
      - "ghcr.io/chattocorp/chatto:{{ .Version }}-amd64"
      - "ghcr.io/chattocorp/chatto:{{ .Version }}-arm64"

  # Stable only, and only when this tag is the highest stable version. That
  # lets a late 0.2.x maintenance release publish 0.2 and 0.2.x tags without
  # moving :latest back from a newer stable line.
  - name_template: "ghcr.io/chattocorp/chatto:latest"
    skip_push: "true"
    image_templates:
      - "ghcr.io/chattocorp/chatto:{{ .Version }}-amd64"
      - "ghcr.io/chattocorp/chatto:{{ .Version }}-arm64"

  # Prerelease only: a floating `:next` tag the dev cluster can track
  # to auto-deploy every alpha, regardless of which Git branch cut the
  # release. Skipped on stable releases so it never drifts to a
  # non-prerelease build.
  - name_template: "ghcr.io/chattocorp/chatto:next"
    skip_push: "true"
    image_templates:
      - "ghcr.io/chattocorp/chatto:{{ .Version }}-amd64"
      - "ghcr.io/chattocorp/chatto:{{ .Version }}-arm64"

homebrew_casks:
  - name: chatto
    skip_upload: "true"
    repository:
      owner: chattocorp
      name: homebrew-tap
      branch: main
    directory: Casks
    binaries:
      - chatto
    description: "Real-time chat app CLI and server"
    homepage: "https://github.com/chattocorp/chatto"
    hooks:
      post:
        install: |
          system_command "codesign", args: ["--force", "--sign", "-", "#{staged_path}/chatto"] if OS.mac?
    caveats: |
      On macOS, this cask performs ad-hoc code signing at install time.

## R2 blob upload disabled until R2 API tokens are configured
## See: https://github.com/chattocorp/chatto/actions/runs/21843246346
# blobs:
#   - provider: s3
#     bucket: "{{ .Env.R2_BUCKET }}"
#     region: auto
#     endpoint: "https://{{ .Env.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
#     directory: "releases/{{ .Version }}"
#     include_meta: true

release:
  github:
    owner: chattocorp
    name: chatto
  # release-please creates a draft GitHub Release with its changelog body.
  # GoReleaser must NOT overwrite it: it should attach artifacts to that
  # draft and leave publication to the workflow step that runs after release
  # artifacts and container images have been pushed.
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  mode: keep-existing
  # `auto` marks the GitHub Release as prerelease when the tag carries
  # a prerelease suffix (e.g. v0.1.0-alpha.1). release-please-action
  # already creates the Release with the correct prerelease flag for
  # prerelease tags; this is belt-and-suspenders in case GoReleaser is
  # invoked outside the release-please flow.
  prerelease: auto
